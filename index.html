<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة المس ساره - تحت الصيانة</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
        }
        body {
            background-color: #0d1117;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            text-align: center;
            padding: 20px;
        }
        .maintenance-card {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 16px;
            padding: 40px 25px;
            max-width: 450px;
            width: 100%;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
        }
        .icon {
            font-size: 60px;
            margin-bottom: 20px;
            display: block;
        }
        h1 {
            color: #f0883e;
            font-size: 22px;
            margin-bottom: 15px;
            font-weight: 800;
        }
        p {
            color: #8b949e;
            font-size: 16px;
            line-height: 1.6;
        }
    </style>
</head>
<body>

    <div class="maintenance-card">
        <span class="icon">🛠️</span>
        <h1>الموقع في صيانة</h1>
        <p>الرجاء الانتظار حتى يتم إصلائحه والعودة للعمل قريباً.</p>
    </div>

</body>
</html>
