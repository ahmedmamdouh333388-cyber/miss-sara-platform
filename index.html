<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة المس ساره - منصة مغلقة حالياً</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-glow: #6366f1;
            --accent-glow: #a855f7;
            --bg-dark: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --border-glow: rgba(99, 102, 241, 0.3);
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            background-image: 
                radial-gradient(at 0% 0%, rgba(99, 102, 241, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(168, 85, 247, 0.15) 0px, transparent 50%);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            overflow: hidden;
        }

        .maintenance-card {
            position: relative;
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border-glow);
            border-radius: 28px;
            padding: 45px 30px;
            max-width: 480px;
            width: 100%;
            text-align: center;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5),
                        0 0 40px rgba(99, 102, 241, 0.15);
            animation: fadeIn 0.8s ease-out;
        }

        /* رمز التروس والأنيميشن */
        .gear-container {
            position: relative;
            width: 100px;
            height: 100px;
            margin: 0 auto 30px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .gear-glow {
            position: absolute;
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, var(--primary-glow), var(--accent-glow));
            border-radius: 50%;
            filter: blur(20px);
            opacity: 0.6;
            animation: pulse 3s infinite alternate;
        }

        .gear-icon {
            font-size: 50px;
            position: relative;
            z-index: 2;
            animation: spin 10s linear infinite;
        }

        /* الشارات والتأثيرات */
        .status-tag {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 6px 18px;
            background: rgba(99, 102, 241, 0.1);
            border: 1px solid rgba(99, 102, 241, 0.3);
            border-radius: 30px;
            color: #818cf8;
            font-size: 13px;
            font-weight: 700;
            margin-bottom: 22px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background-color: #f59e0b;
            border-radius: 50%;
            box-shadow: 0 0 10px #f59e0b;
            animation: blink 1.5s infinite;
        }

        h1 {
            font-size: 26px;
            font-weight: 900;
            margin-bottom: 12px;
            background: linear-gradient(135deg, #ffffff 0%, #cbd5e1 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p {
            color: var(--text-sub);
            font-size: 15px;
            line-height: 1.8;
            margin-bottom: 30px;
            font-weight: 600;
        }

        /* قسم المساعدة والمعلومات */
        .info-box {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            padding: 16px;
            font-size: 13px;
            color: #cbd5e1;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .info-box span {
            color: var(--primary-glow);
            font-weight: 700;
        }

        /* الأنيميشن */
        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        @keyframes pulse {
            from { transform: scale(0.9); opacity: 0.4; }
            to { transform: scale(1.1); opacity: 0.8; }
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="maintenance-card">
        <div class="gear-container">
            <div class="gear-glow"></div>
            <div class="gear-icon">⚙️</div>
        </div>

        <div class="status-tag">
            <span class="status-dot"></span>
            جاري العمل على المنصة
        </div>

        <h1>المنصة تحت الصيانة حالياً</h1>
        <p>نقوم الآن بإجراء بعض التحديثات والتجهيزات الدورية لضمان تقديم أفضل تجربة تعليمية لك. سنعود للعمل في أقرب وقت ممكن!</p>

        <div class="info-box">
            💬 للمساعدة أو استفسار عاجل يمكنك التواصل عبر <span>واتساب المس ساره</span>
        </div>
    </div>

</body>
</html>
