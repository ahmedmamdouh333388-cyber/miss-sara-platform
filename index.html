<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة المس ساره - تحديث النظام</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #00f2fe;
            --secondary: #4facfe;
            --bg-color: #0b0f19;
            --card-bg: rgba(18, 26, 43, 0.75);
            --border-color: rgba(0, 242, 254, 0.2);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(circle at 15% 20%, rgba(0, 242, 254, 0.1) 0%, transparent 40%),
                radial-gradient(circle at 85% 80%, rgba(79, 172, 254, 0.1) 0%, transparent 40%);
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            overflow: hidden;
        }

        .tech-container {
            position: relative;
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            padding: 50px 35px;
            max-width: 500px;
            width: 100%;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6),
                        0 0 30px rgba(0, 242, 254, 0.1);
        }

        /* رمز تقني متطوّر */
        .tech-icon-wrapper {
            position: relative;
            width: 90px;
            height: 90px;
            margin: 0 auto 30px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .outer-ring {
            position: absolute;
            width: 100%;
            height: 100%;
            border: 3px dashed var(--primary);
            border-radius: 50%;
            animation: rotate 12s linear infinite;
        }

        .inner-icon {
            font-size: 40px;
            filter: drop-shadow(0 0 10px var(--primary));
        }

        /* النصوص */
        .status-badge {
            display: inline-block;
            padding: 6px 16px;
            background: rgba(0, 242, 254, 0.1);
            border: 1px solid var(--primary);
            border-radius: 50px;
            color: var(--primary);
            font-size: 13px;
            font-weight: 800;
            letter-spacing: 1px;
            margin-bottom: 20px;
            text-transform: uppercase;
        }

        h1 {
            font-size: 26px;
            font-weight: 900;
            margin-bottom: 12px;
            background: linear-gradient(135deg, #ffffff 0%, var(--primary) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p {
            color: #94a3b8;
            font-size: 15px;
            line-height: 1.7;
            margin-bottom: 30px;
        }

        /* شريط التقدّم */
        .progress-box {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 15px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .progress-info {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            color: #64748b;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            overflow: hidden;
            position: relative;
        }

        .progress-fill {
            height: 100%;
            width: 75%;
            background: linear-gradient(90deg, var(--secondary), var(--primary));
            border-radius: 10px;
            box-shadow: 0 0 12px var(--primary);
            animation: pulse 2s infinite alternate;
        }

        /* الأنيميشن والتأثيرات */
        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        @keyframes pulse {
            from { opacity: 0.7; }
            to { opacity: 1; filter: drop-shadow(0 0 8px var(--primary)); }
        }
    </style>
</head>
<body>

    <div class="tech-container">
        <div class="tech-icon-wrapper">
            <div class="outer-ring"></div>
            <div class="inner-icon">⚡</div>
        </div>

        <span class="status-badge">SYSTEM MAINTENANCE</span>

        <h1>تحديث وصيانة النظام</h1>
        <p>نقوم حالياً بترقية السيرفرات وتحسين أداء منصة المس ساره لضمان تجربة تعليمية أفضل وأسرع. سنعود للعمل قريباً جداً!</p>

        <div class="progress-box">
            <div class="progress-info">
                <span>جاري تحديث البيانات...</span>
                <span>75%</span>
            </div>
            <div class="progress-bar">
                <div class="progress-fill"></div>
            </div>
        </div>
    </div>

</body>
</html>
