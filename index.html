<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المنصة قيد الصيانة</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0d1117;
            color: #c9d1d9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            text-align: center;
            padding: 20px;
        }

        .card {
            background: rgba(22, 27, 34, 0.8);
            border: 1px solid #30363d;
            border-radius: 20px;
            padding: 40px 30px;
            max-width: 480px;
            width: 100%;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(10px);
        }

        .icon-container {
            position: relative;
            width: 90px;
            height: 90px;
            margin: 0 auto 25px auto;
            display: flex;
            justify-content: center;
            align-items: center;
            background: rgba(56, 139, 253, 0.1);
            border-radius: 50%;
            border: 1px solid rgba(56, 139, 253, 0.3);
        }

        .gear {
            font-size: 45px;
            animation: spin 6s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .badge {
            display: inline-block;
            background: #238636;
            color: #ffffff;
            font-size: 13px;
            font-weight: bold;
            padding: 6px 14px;
            border-radius: 20px;
            margin-bottom: 15px;
            letter-spacing: 0.5px;
        }

        h1 {
            color: #58a6ff;
            font-size: 24px;
            margin-bottom: 12px;
        }

        p {
            color: #8b949e;
            font-size: 15px;
            line-height: 1.6;
            margin-bottom: 25px;
        }

        .status-bar {
            background: #21262d;
            border-radius: 10px;
            height: 8px;
            width: 100%;
            overflow: hidden;
            position: relative;
        }

        .progress {
            background: linear-gradient(90deg, #1f6beb, #58a6ff);
            height: 100%;
            width: 65%;
            border-radius: 10px;
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0% { opacity: 0.6; }
            50% { opacity: 1; }
            100% { opacity: 0.6; }
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="icon-container">
            <span class="gear">⚙️</span>
        </div>
        <span class="badge">تحديث ونظام جديد</span>
        <h1>التطبيق قيد الصيانة</h1>
        <p>نقوم حالياً بإجراء بعض التحسينات والإصلاحات التقنية لضمان تقديم أفضل تجربة ممكنة. سيتم إعادة تشغيل التطبيق في أقرب وقت.</p>
        
        <div class="status-bar">
            <div class="progress"></div>
        </div>
    </div>

</body>
</html>
