<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة المس ساره</title>
    <!-- خط القاهرة ورابط أيقونات FontAwesome -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- خلفية تكنولوجية متحركة -->
    <div class="tech-bg">
        <div class="glow-circle sphere-1"></div>
        <div class="glow-circle sphere-2"></div>
    </div>

    <!-- زر المساعدة الدائري العائم والقابل للتحريك -->
    <div id="draggableHelpBtn" class="floating-help-btn" title="تواصل معنا عبر واتساب">
        <i class="fa-brands fa-whatsapp"></i>
    </div>

    <!-- الواجهة الأولى: تسجيل الدخول التكنولوجية -->
    <div id="loginSection" class="card tech-card">
        
        <div class="avatar-container">
            <div class="avatar-glow"></div>
            <img src="file_0000000091a8820ca739a54b10f9fd34.png" alt="شعار المنصة" class="avatar-img">
        </div>

        <h2 class="title">مرحباً بكم في منصة <span class="highlight">المس ساره</span></h2>
        <p class="subtitle">بوابتك للتعليم الحديث والذكي</p>

        <form id="loginForm">
            <div class="input-group">
                <i class="fa-solid fa-lock input-icon"></i>
                <input type="password" id="passwordInput" class="input-field" placeholder="أدخل كلمة السر للمتابعة" autocomplete="off" required>
            </div>
            <div id="errorMsg" class="error-msg">كلمة السر غير صحيحة!</div>

            <button type="submit" class="btn-submit">
                <span>دخول</span>
                <i class="fa-solid fa-right-to-bracket"></i>
            </button>
        </form>

        <a href="#" class="forgot-link whatsapp-trigger">هل نسيت كلمة السر؟</a>
    </div>

    <!-- الواجهة الثانية: المحاضرات -->
    <div id="lecturesSection" class="dashboard-card tech-card hidden">
        <h2 class="dashboard-title">محاضرات منصة <span class="highlight">المس ساره</span></h2>

        <div class="lectures-grid">
            <!-- المحاضرة الأولى -->
            <div id="lecture1Card" class="lecture-card active">
                <div class="lecture-icon"><i class="fa-solid fa-book-open"></i></div>
                <div class="lecture-info">
                    <h3>المحاضرة الأولى</h3>
                    <p class="status-available">متاحة الآن - اضغط للمشاهدة</p>
                </div>
            </div>

            <!-- المحاضرة الثانية -->
            <div class="lecture-card disabled">
                <div class="lecture-icon"><i class="fa-solid fa-lock"></i></div>
                <div class="lecture-info">
                    <h3>المحاضرة الثانية</h3>
                    <p class="status-soon">قريباً سيتم توافرها</p>
                </div>
            </div>

            <!-- المحاضرة الثالثة -->
            <div class="lecture-card disabled">
                <div class="lecture-icon"><i class="fa-solid fa-lock"></i></div>
                <div class="lecture-info">
                    <h3>المحاضرة الثالثة</h3>
                    <p class="status-soon">قريباً سيتم توافرها</p>
                </div>
            </div>
        </div>
    </div>

    <!-- الواجهة الثالثة: عرض الفيديو -->
    <div id="videoSection" class="video-card tech-card hidden">
        <div class="video-header">
            <button id="backToLecturesBtn" class="btn-back"><i class="fa-solid fa-arrow-right"></i> العودة للمحاضرات</button>
            <button id="fullscreenBtn" class="btn-fullscreen">ملء الشاشة <i class="fa-solid fa-expand"></i></button>
        </div>

        <h2 class="video-title">المحاضرة الأولى</h2>
        
        <div class="video-wrapper">
            <video id="lectureVideo" controls controlsList="nodownload" playsinline>
                <source src="90bbbd05f3f28500e7048508a1ad9b37.mp4" type="video/mp4">
                متصفحك لا يدعم تشغيل الفيديو.
            </video>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
